name: Continuous Integration

on:
  push:
  pull_request:

# A PR's push and pull_request events run the same tests: let the later one cancel the earlier.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  # A strategy branch may change strategy code only (tools/check_strategy_branch.py).
  # Runs the base branch's copy of the checker, so the branch under test can't loosen it.
  strategy-branch:
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'strategy/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Only strategy code changed
        run: |
          git show "origin/${{ github.base_ref }}:tools/check_strategy_branch.py" > "$RUNNER_TEMP/check_strategy_branch.py"
          python3 "$RUNNER_TEMP/check_strategy_branch.py" --base "origin/${{ github.base_ref }}"

  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@v0.8.3
        with:
          run-install: false

      - name: Run tests
        run: |
          if [[ $GITHUB_EVENT_NAME == "push" ]]; then
            pixi run -- pytest utama_core/tests/ --level full --ignore-glob "**/*grsim*" --headless --junit-xml=test-results.xml
          elif [[ $GITHUB_EVENT_NAME == "pull_request" ]]; then
            pixi run -- pytest utama_core/tests/ --level quick --ignore-glob "**/*grsim*" --headless --junit-xml=test-results.xml
          fi


      - name: Test Report
        if: always()
        uses: pmeier/pytest-results-action@main
        with:
          path: test-results.xml
          summary: true
          display-options: fEX
          fail-on-empty: true
          title: RSoccer CI Test Results
