profile_name: "gefr"
rules:
  goal_detection:
    enabled: true
    cooldown_seconds: 1.0
  out_of_bounds:
    enabled: true
    free_kick_assigner: "last_touch"
  defense_area:
    enabled: false
    max_defenders: 1
    attacker_infringement: true
  keep_out:
    enabled: false
    radius_meters: 0.3
    violation_persistence_frames: 30
game:
  half_duration_seconds: 300.0
  kickoff_team: "yellow"
  force_start_after_goal: true
  stop_duration_seconds: 3.0
  prepare_duration_seconds: 3.0
  kickoff_timeout_seconds: 10.0
  auto_advance:
    stop_to_next_command: false
    prepare_kickoff_to_normal: false
    prepare_penalty_to_normal: false
    direct_free_to_normal: false
    ball_placement_to_next: false       # human places ball; operator presses FORCE_START manually
    normal_start_to_force: true         # auto-force if kickoff stalls
    # ball_obscured_recovery: true      # uncomment after feat/ball-obscured-recovery is merged
